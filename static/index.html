<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTB Chess</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="lobby">
    <h1>OTB Chess</h1>
    <p>An educational chessboard that simulates physical board play.</p>

    <div class="lobby-section">
      <h2>Create a Game</h2>

      <label>Play as:</label>
      <div class="radio-group">
        <label><input type="radio" name="side" value="white" checked> White</label>
        <label><input type="radio" name="side" value="black"> Black</label>
      </div>

      <label>Time Control:</label>
      <div class="preset-buttons">
        <button class="preset-btn" data-time="180000" data-inc="0">3+0</button>
        <button class="preset-btn" data-time="180000" data-inc="2000">3+2</button>
        <button class="preset-btn" data-time="300000" data-inc="0">5+0</button>
        <button class="preset-btn" data-time="300000" data-inc="3000">5+3</button>
        <button class="preset-btn" data-time="900000" data-inc="0">15+0</button>
        <button class="preset-btn" data-time="900000" data-inc="10000">15+10</button>
        <button class="preset-btn selected" data-time="1800000" data-inc="0">30+0</button>
      </div>

      <div class="custom-time">
        <label>Minutes: <input type="number" id="customMinutes" value="30" min="1" max="180"></label>
        <label>Increment (sec): <input type="number" id="customIncrement" value="0" min="0" max="60"></label>
      </div>
      <div id="timeError" style="color:#c0392b;font-size:13px;margin:0 0 8px;"></div>

      <label>Number of illegal moves causing game loss:</label>
      <select id="maxIllegalMoves">
        <option value="1">1</option>
        <option value="2" selected>2 (FIDE default)</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="-1">Unlimited</option>
      </select>

      <label>Continue clock without confirmation after restored position:</label>
      <div class="radio-group">
        <label><input type="radio" name="autoResumeAfterRestore" value="true" checked> Yes</label>
        <label><input type="radio" name="autoResumeAfterRestore" value="false"> No</label>
      </div>

      <label>Starting position FEN <span style="font-weight:normal;color:#888;">(optional — leave empty for normal start)</span>:</label>
      <input type="text" id="startingFen" placeholder="e.g. rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
      <p style="font-size:12px;color:#777;margin:-4px 0 12px;">
        If supplied, the game starts from this position. The side to move in the FEN plays first;
        the player creating the game is given that side automatically.
      </p>

      <div id="fenError" style="color:#c0392b;font-size:13px;margin:0 0 10px;"></div>
      <button id="createGameBtn" class="primary-btn">Create Game</button>
    </div>

    <div class="lobby-section">
      <h2>Join a Game</h2>
      <label>Game Code:</label>
      <input type="text" id="gameCodeInput" placeholder="Enter game code">
      <button id="joinGameBtn" class="primary-btn">Join Game</button>
    </div>
  </div>

  <script>
    let selectedTime = 1800000;
    let selectedInc = 0;

    // Preset buttons
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTime = parseInt(btn.dataset.time);
        selectedInc = parseInt(btn.dataset.inc);
        document.getElementById('customMinutes').value = Math.floor(selectedTime / 60000);
        document.getElementById('customIncrement').value = Math.floor(selectedInc / 1000);
      });
    });

    document.getElementById('customMinutes').addEventListener('change', () => {
      selectedTime = parseInt(document.getElementById('customMinutes').value) * 60000;
      selectedInc = parseInt(document.getElementById('customIncrement').value) * 1000;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
    });
    document.getElementById('customIncrement').addEventListener('change', () => {
      selectedTime = parseInt(document.getElementById('customMinutes').value) * 60000;
      selectedInc = parseInt(document.getElementById('customIncrement').value) * 1000;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
    });

    // Create game — validate any supplied FEN first, then redirect to game.html (game.js handles
    // the WebSocket). An invalid FEN keeps the player on the start screen with the reason rather
    // than sending them to a board they cannot leave.
    document.getElementById('createGameBtn').addEventListener('click', async () => {
      const side = document.querySelector('input[name="side"]:checked').value;
      const maxIllegal = document.getElementById('maxIllegalMoves').value;
      const autoResumeAfterRestore =
        document.querySelector('input[name="autoResumeAfterRestore"]:checked').value;
      const fen = document.getElementById('startingFen').value.trim();
      const fenError = document.getElementById('fenError');
      fenError.textContent = '';

      // Reject a zero (or empty) initial time — the side to move would flag the instant the
      // opponent joins, before ever moving. The number input's min=1 only guards the spinner,
      // not manual entry, so enforce it here.
      const minutes = parseInt(document.getElementById('customMinutes').value, 10);
      const incrementSec = parseInt(document.getElementById('customIncrement').value, 10);
      const timeError = document.getElementById('timeError');
      timeError.textContent = '';
      if (!Number.isFinite(minutes) || minutes < 1) {
        timeError.textContent = 'Minimum time is 1 minute.';
        document.getElementById('customMinutes').focus();
        return;
      }
      const time = minutes * 60000;
      const inc = (Number.isFinite(incrementSec) && incrementSec > 0 ? incrementSec : 0) * 1000;

      if (fen) {
        try {
          const resp = await fetch('/api/validateFen?fen=' + encodeURIComponent(fen), { cache: 'no-store' });
          const result = await resp.json();
          if (!result.valid) {
            fenError.textContent = result.message || 'Invalid FEN.';
            return; // stay on the start screen
          }
        } catch (e) {
          fenError.textContent = 'Could not validate the FEN. Please try again.';
          return;
        }
      }

      let url = '/game.html?creator=true&side=' + side
        + '&time=' + time + '&inc=' + inc
        + '&maxIllegal=' + encodeURIComponent(maxIllegal)
        + '&autoResumeAfterRestore=' + encodeURIComponent(autoResumeAfterRestore);
      if (fen) {
        url += '&fen=' + encodeURIComponent(fen);
      }
      window.location.href = url;
    });

    // Join game
    function joinGame() {
      const gameId = document.getElementById('gameCodeInput').value.trim();
      if (!gameId) {
        document.getElementById('gameCodeInput').style.borderColor = '#c0392b';
        return;
      }
      window.location.href = '/game.html?gameId=' + gameId;
    }

    document.getElementById('joinGameBtn').addEventListener('click', joinGame);
    document.getElementById('gameCodeInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinGame();
    });

    // TESTING-ONLY: fetch the most recently created joinable game ID from the server so a second
    // browser session can join without copy/paste. Remove once development is done.
    fetch('/api/lastGameId', { cache: 'no-store' })
      .then(r => r.ok ? r.text() : '')
      .then(id => {
        const trimmed = (id || '').trim();
        if (trimmed) {
          document.getElementById('gameCodeInput').value = trimmed;
        }
      })
      .catch(() => { /* ignore — endpoint is testing convenience only */ });
  </script>
</body>
</html>
