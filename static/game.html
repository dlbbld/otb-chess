<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTB Chess - Game</title>
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="game-layout">
    <!-- Left column: side area + board + buttons below -->
    <div class="board-column">
      <div class="board-row">
        <!-- Left side area (opponent's off-board pieces) -->
        <div class="side-area" id="leftSideArea">
          <div class="side-area-label" id="leftSideLabel"></div>
          <div class="side-area-pieces" id="leftSidePieces"></div>
        </div>

        <!-- The chessboard -->
        <div class="board" id="board"></div>

        <!-- Right side area (own off-board pieces) -->
        <div class="side-area" id="rightSideArea">
          <div class="side-area-label" id="rightSideLabel"></div>
          <div class="side-area-pieces" id="rightSidePieces"></div>
        </div>

        <!-- Transient game-event banner ("Game started"), centered over the board. -->
        <div class="game-banner" id="gameBanner" style="display:none;"></div>
      </div>

      <!-- Controls below the board -->
      <div class="board-controls">
        <div class="control-row game-actions" aria-label="Game actions">
          <button id="abortBtn" class="action-btn control-btn" style="display:none;"
              aria-label="Abort Game" data-tooltip="Abort Game">
            <span class="btn-icon icon-stop" aria-hidden="true">!</span>
          </button>
          <button id="offerDrawBtn" class="action-btn control-btn" disabled
              aria-label="Offer Draw" data-tooltip="Offer Draw">
            <span class="btn-icon icon-draw" aria-hidden="true">1/2</span>
          </button>
          <button id="resignBtn" class="action-btn control-btn" disabled
              aria-label="Resign" data-tooltip="Resign">
            <span class="btn-icon icon-resign" aria-hidden="true"></span>
          </button>
        </div>

        <div class="control-row claim-section" aria-label="Draw claims">
          <button id="claimThreefoldOnBoardBtn" class="action-btn control-btn claim-btn" disabled
              aria-label="Claim threefold repetition on the current position"
              data-tooltip="Claim threefold repetition on the current position">
            <span class="btn-icon claim-icon" aria-hidden="true">
              <span class="claim-rule">3x</span>
              <span class="claim-kind icon-board"></span>
            </span>
          </button>
          <button id="claimThreefoldWithMoveBtn" class="action-btn control-btn claim-btn" disabled
              aria-label="Claim threefold repetition with a move"
              data-tooltip="Claim threefold repetition with a move">
            <span class="btn-icon claim-icon" aria-hidden="true">
              <span class="claim-rule">3x</span>
              <span class="claim-kind icon-move">-></span>
            </span>
          </button>
          <button id="claimFiftyMoveOnBoardBtn" class="action-btn control-btn claim-btn" disabled
              aria-label="Claim the 50-move rule on the current position"
              data-tooltip="Claim the 50-move rule on the current position">
            <span class="btn-icon claim-icon" aria-hidden="true">
              <span class="claim-rule">50</span>
              <span class="claim-kind icon-board"></span>
            </span>
          </button>
          <button id="claimFiftyMoveWithMoveBtn" class="action-btn control-btn claim-btn" disabled
              aria-label="Claim the 50-move rule with a move"
              data-tooltip="Claim the 50-move rule with a move">
            <span class="btn-icon claim-icon" aria-hidden="true">
              <span class="claim-rule">50</span>
              <span class="claim-kind icon-move">-></span>
            </span>
          </button>
        </div>

        <div class="control-row utility-actions" aria-label="Board utilities">
          <button id="requestPieceBtn" class="action-btn control-btn utility-btn" disabled
              aria-label="Request Piece" data-tooltip="Request Piece">
            <span class="btn-icon icon-piece" aria-hidden="true">+</span>
          </button>
          <button id="exportPgnBtn" class="action-btn control-btn utility-btn"
              aria-label="Display PGN" data-tooltip="Display PGN">
            <span class="btn-icon icon-pgn" aria-hidden="true">PGN</span>
          </button>
          <button id="flipBoardBtn" class="action-btn control-btn utility-btn"
              aria-label="Flip Board" data-tooltip="Flip Board">
            <span class="btn-icon icon-flip" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="app-version board-version" data-app-version></div>
    </div>

    <!-- Right column: messages on top, chess clock below (about 1/3 of board height). -->
    <div class="right-column">
    <!-- Game info panel (messages, dialogs) -->
    <div class="info-panel">
      <!-- Arbiter message -->
      <div class="arbiter-panel" id="arbiterPanel">
        <div class="arbiter-message" id="arbiterMessage">Welcome. Waiting for opponent...</div>
        <div class="arbiter-buttons" id="arbiterButtons"></div>
      </div>

      <!-- Game result -->
      <div id="gameResultPanel" class="game-result-panel" style="display:none;">
        <div class="game-result-score" id="gameResultScore"></div>
        <div class="game-result-reason" id="gameResultReason"></div>
        <!-- Rematch (Lichess-style): first click offers — the opponent's button starts blinking;
             their click accepts. Same time control, colours swapped. -->
        <button id="rematchBtn" class="action-btn">Rematch</button>
        <button id="newGameBtn" class="action-btn">New Game</button>
      </div>

      <!-- Draw offer received — the "Your opponent offers a draw." text already appears in
           the arbiter message panel above, so the inline panel only carries the buttons. -->
      <div id="drawOfferPanel" class="inline-panel" style="display:none;">
        <button id="acceptDrawBtn" class="action-btn">Accept</button>
        <button id="rejectDrawBtn" class="action-btn">Reject</button>
      </div>

      <!-- Inline confirmation panel -->
      <div id="confirmPanel" class="inline-panel" style="display:none;">
        <span id="confirmMessage"></span>
        <button id="confirmYesBtn" class="action-btn">Yes</button>
        <button id="confirmNoBtn" class="action-btn">No</button>
      </div>

      <!-- Inline SAN input for draw claims -->
      <div id="sanInputPanel" class="inline-panel" style="display:none;">
        <span id="sanClaimLabel">Enter move:</span>
        <input type="text" id="sanInput" class="san-input" placeholder="e.g. Nf3">
        <button id="submitClaimMoveBtn" class="action-btn">Submit</button>
        <button id="cancelClaimMoveBtn" class="action-btn">Cancel</button>
      </div>

      <!-- Inline promotion piece selection -->
      <div id="promotionPanel" class="inline-panel" style="display:none;">
        <span>Select a piece:</span>
        <div class="promotion-pieces" id="promotionPieces"></div>
      </div>

      <!-- PGN display panel -->
      <div id="pgnDialog" class="pgn-panel" style="display:none;">
        <h3>PGN</h3>
        <textarea id="pgnText" readonly></textarea>
        <button id="closePgnBtn" class="action-btn">Close</button>
      </div>
    </div>

    <!-- Chess clock — DGT 3000 inspired, sized to about 1/3 of the board height
         and centered vertically next to the board, with messages above it. -->
    <div class="chess-clock" id="chessClock">
      <div class="clock-displays">
        <div class="clock-display" id="topClockDisplay">
          <span class="clock-time" id="topClockTime">30:00</span>
          <span class="clock-side-label" id="topClockLabel"></span>
        </div>
        <div class="clock-divider"></div>
        <div class="clock-display" id="bottomClockDisplay">
          <span class="clock-time" id="bottomClockTime">30:00</span>
          <span class="clock-side-label" id="bottomClockLabel"></span>
        </div>
      </div>
      <div class="clock-rocker">
        <div class="clock-lever-btn" id="topClockBtn">
          <div class="lever-surface"></div>
        </div>
        <div class="clock-lever-btn" id="bottomClockBtn">
          <div class="lever-surface"></div>
        </div>
      </div>
    </div>

    <!-- Below the clock: the passive game-information window plus the time control. -->
    <div class="below-clock">
      <!-- Passive info: what the opponent just did (e.g. a wrong-time draw claim). Face-to-face
           principle — at a real board the player would see it happen — but it requires NO
           action, so it lives here and never in the arbiter message window above the clock. -->
      <div class="opponent-info" id="opponentInfoPanel" style="display:none;"></div>
      <!-- Time control, e.g. "5+3 • Blitz" (FIDE discipline). Centered in the remaining space,
           about level with the bottom edge of the board — quiet and out of the way. -->
      <div class="time-control-label" id="timeControlLabel"></div>
    </div>
    </div>
  </div>

  <!-- Developer console for technical error detail. Hidden by default; shown on
       the first arriving devDetail. Stays out of the user-visible arbiter area. -->
  <div id="devConsole" class="dev-console" style="display:none;">
    <div class="dev-console-header">
      <span class="dev-console-title">Developer log</span>
      <button id="devConsoleClearBtn" class="dev-console-btn" type="button">clear</button>
      <button id="devConsoleToggleBtn" class="dev-console-btn" type="button">hide</button>
    </div>
    <div id="devConsoleBody" class="dev-console-body"></div>
  </div>

  <script src="js/board.js"></script>
  <script src="js/websocket.js"></script>
  <script src="js/app-version.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
