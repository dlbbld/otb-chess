# Reasons the chess library reports for an illegal move, and how the arbiter states them.
#
# The library phrases a reason conditionally ("it would ..."), which fits a move that was only
# presented to it. The player has made the move on the board, so the arbiter states what the move
# does. Reasons without an entry here are passed through unchanged.
#
# One pair per reason: `.library` is matched literally against the library's text, `.arbiter` is
# what the player and the opponent are told. A `.library` without its `.arbiter` (or the reverse)
# fails at startup rather than silently dropping the restatement.

king_left_in_check.library=it would leave the own king in check
king_left_in_check.arbiter=it leaves the own king in check

king_exposed_to_check.library=it would expose the own king to check
king_exposed_to_check.arbiter=it exposes the own king to check
